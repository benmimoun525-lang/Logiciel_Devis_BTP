<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chiffrage Devis BTP</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #94a3b8; }
        #resultat { margin-top: 20px; padding: 15px; background: #1e293b; color: #38bdf8; font-family: monospace; white-space: pre-wrap; border-radius: 5px; min-height: 150px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Générateur de Devis BTP (DZD)</h2>
    <p>Sélectionnez un devis vierge ou un métré (PDF, Image, Texte) :</p>
    
    <input type="file" id="fichierDevis" /><br><br>
    <button id="btnLancer" onclick="envoyerFichier()">Lancer le chiffrage</button>

    <h3>Résultat en direct :</h3>
    <div id="resultat">En attente de votre fichier...</div>
</div>

<script>
    // ⚠️ REMPLACER PAR VOTRE VRAIE URL RENDER ⚠️
    const RENDER_URL = "https://logiciel-devis-btp.onrender.com/chiffrer-devis";

    async function envoyerFichier() {
        const input = document.getElementById('fichierDevis');
        const resultat = document.getElementById('resultat');
        const btn = document.getElementById('btnLancer');

        if (!input.files[0]) {
            alert("Veuillez d'abord choisir un fichier !");
            return;
        }

        const formData = new FormData();
        formData.append('file', input.files[0]);

        btn.disabled = true;
        resultat.textContent = "Connexion au serveur Render...\n";

        try {
            const response = await fetch(RENDER_URL, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("Erreur HTTP " + response.status);

            resultat.textContent = ""; // On vide la zone de texte
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            // Lecture du flux en direct
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                resultat.textContent += chunk; // Affiche le texte au fur et à mesure
            }

        } catch (err) {
            resultat.textContent += "\nErreur : " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
