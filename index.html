<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Devis BTP Excel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #1e3a8a; font-size: 1.6rem; margin-top: 0; }
        label { font-weight: bold; display: block; margin-bottom: 8px; margin-top: 20px; color: #334155; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .file-box { background: #f1f5f9; border: 2px dashed #94a3b8; padding: 10px; border-radius: 6px; }
        .btn { background: #d97706; color: white; border: none; padding: 16px; width: 100%; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        .btn:hover { background: #b45309; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-excel { background: #16a34a; display: none; margin-top: 15px; }
        .btn-excel:hover { background: #15803d; }
        .status { padding: 15px; background: #e2e8f0; border-radius: 6px; margin-top: 20px; font-weight: bold; text-align: center; color: #475569; }
        .log-box { background: #1e293b; color: #4ade80; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; margin-top: 10px; min-height: 120px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white;">
        <h1 style="color: white;">Extracteur BTP vers Excel 📊</h1>
        <p style="margin:0; opacity: 0.9;">Importez les pages de votre devis vierge. L'IA extrait les articles, estime les Prix Unitaires (HT) et vous génère un fichier Excel pré-calculé.</p>
    </div>

    <div class="card">
        <label>👤 Nom du Projet ou du Client :</label>
        <input type="text" id="nomClient" placeholder="Ex: Projet Construction Villa Alger">

        <label>📄 Importez les pages du devis (Photos, Scans, PDF) :</label>
        <div class="file-box">
            <input type="file" id="fichiersDevis" multiple accept=".pdf,image/*">
        </div>

        <button id="btnLancer" class="btn" onclick="lancerExtraction()">⚙️ Lancer l'Extraction vers Excel</button>
        
        <div id="statusBadge" class="status">En attente des documents...</div>
        <div id="logArea" class="log-box">Console système prête... En attente d'une tâche.</div>

        <button id="btnExportExcel" class="btn btn-excel" onclick="telechargerExcel()">📥 Télécharger le Devis au format Excel (.xlsx)</button>
    </div>
</div>

<script>
    const RENDER_BASE = "https://logiciel-devis-btp.onrender.com";
    let articlesExtraits = [];

    async function lancerExtraction() {
        const nomClient = document.getElementById('nomClient').value.trim() || "Client_Anonyme";
        const input = document.getElementById('fichiersDevis');
        const btn = document.getElementById('btnLancer');
        const badge = document.getElementById('statusBadge');
        const logs = document.getElementById('logArea');
        const btnExcel = document.getElementById('btnExportExcel');

        if (!input.files || input.files.length === 0) {
            alert("Veuillez sélectionner au moins une page ou une photo du devis.");
            return;
        }

        const files = Array.from(input.files);
        btn.disabled = true;
        btnExcel.style.display = "none";
        articlesExtraits = [];
        let currentIndex = 1;

        badge.style.background = "#fef3c7";
        badge.style.color = "#92400e";
        logs.textContent = "🚀 Démarrage de l'analyse...\n";

        try {
            for (let i = 0; i < files.length; i++) {
                badge.textContent = `Traitement de la page ${i + 1} sur ${files.length}...`;
                logs.textContent += `\n-> Envoi de la page ${i + 1} à l'IA... (Patientez)\n`;

                const formData = new FormData();
                formData.append('file', files[i]);
                formData.append('page_num', i + 1);
                formData.append('start_index', currentIndex);

                let success = false;
                let retries = 0;

                while (!success && retries < 3) {
                    try {
                        const response = await fetch(`${RENDER_BASE}/chiffrer-page`, {
                            method: 'POST', body: formData
                        });

                        // RECUPERATION DE LA VRAIE ERREUR DU SERVEUR
                        if (!response.ok) {
                            let errorDetail = await response.text();
                            throw new Error(`Erreur Serveur: ${errorDetail}`);
                        }

                        const data = await response.json();
                        let cleanJson = data.raw_json ? data.raw_json.trim() : "[]";
                        
                        const startIdx = cleanJson.indexOf('[');
                        const endIdx = cleanJson.lastIndexOf(']');
                        if (startIdx !== -1 && endIdx !== -1) {
                            cleanJson = cleanJson.substring(startIdx, endIdx + 1);
                        }

                        let pageArticles = [];
                        try {
                            pageArticles = JSON.parse(cleanJson);
                        } catch (parseError) {
                            const lastObject = cleanJson.lastIndexOf('}');
                            if (lastObject !== -1) {
                                pageArticles = JSON.parse(cleanJson.substring(0, lastObject + 1) + ']');
                            }
                        }

                        articlesExtraits = articlesExtraits.concat(pageArticles);
                        currentIndex += pageArticles.length;
                        
                        logs.textContent += `   ✅ Page ${i + 1} terminée ! (${pageArticles.length} articles ajoutés)\n`;
                        success = true;

                    } catch (err) {
                        retries++;
                        logs.textContent += `   ⚠️ ${err.message}. Relance auto... (Essai ${retries}/3)\n`;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }
                
                if (!success) {
                    logs.textContent += `   ❌ Impossible de traiter la page ${i + 1} après 3 essais.\n`;
                }
            }

            // BLOCAGE SI AUCUN ARTICLE
            if (articlesExtraits.length === 0) {
                badge.textContent = "Échec : Aucun article extrait du document.";
                badge.style.background = "#fee2e2";
                badge.style.color = "#991b1b";
                logs.textContent += `\n❌ Processus annulé. Le fichier Excel n'a pas été généré car il serait vide.`;
            } else {
                badge.textContent = `Extraction terminée avec succès ! (${articlesExtraits.length} articles trouvés)`;
                logs.textContent += `\n🎉 Processus 100% terminé. Vous pouvez télécharger le fichier Excel avec les formules actives !`;
                badge.style.background = "#dcfce7";
                badge.style.color = "#166534";
                btnExcel.style.display = "block";
            }

        } catch (err) {
            badge.textContent = "Erreur fatale";
            badge.style.background = "#fee2e2";
            badge.style.color = "#991b1b";
            logs.textContent += `\n🔥 ERREUR CRITIQUE : ${err.message}`;
        } finally {
            btn.disabled = false;
        }
    }

    async function telechargerExcel() {
        const nomClient = document.getElementById('nomClient').value || "Projet_Sans_Nom";
        
        try {
            const response = await fetch(`${RENDER_BASE}/exporter-excel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nom_client: nomClient,
                    articles: articlesExtraits
                })
            });

            if (!response.ok) throw new Error("Le serveur n'a pas pu créer le fichier Excel.");

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Devis_Estime_${nomClient.replace(/\s+/g, '_')}.xlsx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (e) {
            alert("Erreur de téléchargement : " + e.message);
        }
    }
</script>

</body>
</html>
